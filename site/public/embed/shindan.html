<body>
<div class="wrap">
  <span class="tag">無料・登録不要</span>
  <h1>どうぶつ診断</h1>
  <p class="lede">人が動かないのは、性格ではなく<strong>「関わりの設計」</strong>かもしれない。恐怖・報酬・学習・同調の4つから、<strong>組織・自分・家庭</strong>がどの動物の設計に寄っているかを見る。</p>

  <div class="switch" role="group" aria-label="診断する対象">
    <button type="button" data-t="org" aria-pressed="true">組織・チーム</button>
    <button type="button" data-t="self" aria-pressed="false">自分（関わり方の癖）</button>
    <button type="button" data-t="family" aria-pressed="false">家庭・子育て</button>
  </div>
  <p class="tagline muted" id="tagline"></p>
  <p class="note0 muted small" id="note0"></p>

  <form id="f" novalidate></form>
  <p id="err" class="err" hidden>未回答の質問があります。すべて選んでください。</p>
  <button type="button" class="cta solid" id="go">診断する</button>

  <section id="result" class="result" hidden aria-live="polite"></section>

  <p class="muted small disclaimer" style="margin-top:1.5rem">
    動物から組織を読む二層理論。これは実測モデルではなく、行動学の知見を使った仮説生成ツールです。
  </p>
</div>

  hyena:{label:'ハイエナ家庭',finding:'その場の機嫌・損得で対応が決まる関わりに寄っている。',weakness:'同じ行動でも対応がバラつくと、子は「何が正解か」を読めず、言う回数を増やすほど混乱が増える。',action:'叱る「強さ」より「毎回同じ」を優先する。一つの行動だけ対応を固定して試す。'}
};
var TYPES_BY_TARGET = {org:TYPES, self:TYPES_SELF, family:TYPES_FAMILY};

/* 結果→参考記事（リッチカード用：t=タイトル/s=要点/u=URL）。org/self の型記事は公開で有効化／family はハブ記事=公開済 */
var NOTE = 'https://note.com/large_weasel4290/n/';
var FAM = {t:'あなたの家庭は、どの動物の群れに似ているか', s:'子育てを動かす「4つのダイヤル」（無料・全文）', u:NOTE+'na510696cbe44'};
var NOTE_REF = {
  org: {
    ookami: {t:'親方オオカミ型を深掘り', s:'少人数で速い群れの強みと「属人化」の解き方', u:NOTE+'ne12a84a42c15'},
    ari:    {t:'規律アリ型を深掘り',   s:'再現性の強さと、創造が出にくくなる境目',   u:NOTE+'n7a7dffb6cd19'},
    kochoku:{t:'硬直アリ型を深掘り',   s:'前例主義が組織を固める仕組みと、その壊し方', u:NOTE+'n7a7dffb6cd19'},
    hyena:  {t:'恐怖ハイエナ型を深掘り', s:'数字で走る強さと、悪い情報が止まる代償',   u:NOTE+'n97da4f76ffcf'},
    chimp:  {t:'政治チンパン型を深掘り', s:'力が社外でなく社内（政治）へ向く構造',     u:NOTE+'n106fde59a835'},
    bonobo: {t:'ぬるいボノボ型を深掘り', s:'安全だが停滞する理由と、基準の立て方',     u:NOTE+'n23e38d55ef9d'},
    ecosys: {t:'5類型の地図（総論）',   s:'層ごとに動物相を使い分ける設計',           u:NOTE+'n6d98d24d19f3'}
  },
  self: {
    ookami: {t:'オオカミ型の関わりを深掘り',       s:'恐怖・締切で動かす癖の強みと限界',     u:NOTE+'ne12a84a42c15'},
    ari:    {t:'アリ型の関わりを深掘り',           s:'規範で揃える強さと、内発が薄まる場面', u:NOTE+'n7a7dffb6cd19'},
    chimp:  {t:'チンパン型の関わりを深掘り',       s:'比較・報酬で動かす癖と、その副作用',   u:NOTE+'n106fde59a835'},
    bonobo: {t:'ボノボ型の関わりを深掘り',         s:'受容・先回りが相手の自走を奪うとき',   u:NOTE+'n23e38d55ef9d'},
    hyena:  {t:'ムラありハイエナ型の関わりを深掘り', s:'一貫性のブレが学習を止める仕組み',   u:NOTE+'n97da4f76ffcf'}
  },
  family: {ookami:FAM, ari:FAM, chimp:FAM, bonobo:FAM, hyena:FAM}
};
var TYPE_COLORS = {ookami:'#6b7280', ari:'#3b7dd8', kochoku:'#9c7a4d', hyena:'#e0584a', chimp:'#8a6fc0', bonobo:'#d27aa6', ecosys:'#3f9d5b'};

/* ===== 採点（diagnosis.js を移植・決定的）===== */
function mean(){var a=[].slice.call(arguments),s=0,i;for(i=0;i<a.length;i++)s+=a[i];return s/a.length;}
function norm(m){return Math.round((m-1)/4*100);}
function clamp01(x){return Math.max(0,Math.min(1,x));}
function hi(v){return clamp01((v-50)/50);}
function lo(v){return clamp01((50-v)/50);}
function mid(v){return clamp01(1-Math.abs(v-65)/35);}
function stdev(xs){var m=mean.apply(null,xs);return Math.sqrt(mean.apply(null,xs.map(function(x){return (x-m)*(x-m);})));}
function balance(){var vs=[].slice.call(arguments);return clamp01((mean.apply(null,vs)-55)/35)*clamp01(1-stdev(vs)/30);}
function normMean(){var xs=[].slice.call(arguments).filter(function(v){return isFinite(v);});return xs.length?norm(mean.apply(null,xs)):50;}
var ORG_PRIORITY=['hyena','kochoku','chimp','bonobo','ookami','ari','ecosys'];
var ANIMAL_PRIORITY=['hyena','chimp','bonobo','ookami','ari'];

function blend(scores, exclude, types){
  exclude=exclude||[];
  var entries=Object.keys(scores).filter(function(k){return exclude.indexOf(k)<0;}).map(function(k){return [k,scores[k]];});
  var S=entries.reduce(function(a,e){return a+Math.max(0,e[1]);},0);
  var maxRaw=entries.reduce(function(m,e){return Math.max(m,e[1]);},0);
  if(S<0.05||maxRaw<0.25) return {ordered:[],weak:true};
  var raw=entries.map(function(e){return {key:e[0],label:(types[e[0]]||{}).label||e[0],pct:Math.max(0,e[1])/S*100};})
    .sort(function(a,b){return b.pct-a.pct;})
    .map(function(p){return {key:p.key,label:p.label,pct:Math.round(p.pct)};});
  var diff=100-raw.reduce(function(a,p){return a+p.pct;},0);
  if(raw.length) raw[0].pct+=diff;
  return {ordered:raw,weak:false};
}
function pickWinner(scores, priority){
  var ranked=Object.keys(scores).map(function(k){return [k,scores[k]];}).sort(function(a,b){return b[1]-a[1] || priority.indexOf(a[0])-priority.indexOf(b[0]);});
  var top=ranked[0][1];
  var near=ranked.filter(function(e){return top-e[1]<0.05;}).sort(function(a,b){return priority.indexOf(a[0])-priority.indexOf(b[0]);});
  var key=near[0][0];
  return {ranked:ranked,winnerKey:key,winnerScore:scores[key]};
}
function diagnose(target, answers){
  if(target==='self') return diagnoseSelf(answers);
  if(target==='family') return diagnoseFamily(answers);
  return diagnoseOrg(answers);
}
function diagnoseOrg(a){
  function r(k){return Number(a['q'+k]);}
  var fear=norm(mean(r(1),r(2),r(3))), reward=norm(mean(r(4),r(5),r(6))), learn=norm(mean(r(7),r(8),r(9))), conform=norm(mean(r(10),r(11),r(12)));
  var solo=normMean(6-r(13),r(21)), prec=normMean(r(14),r(19)), inst=normMean(r(15)), numBias=normMean(6-r(6),r(16)),
      open=normMean(r(11),6-r(17)), badNews=normMean(r(20)), slack=normMean(r(18)), confq=normMean(r(24));
  var scores={
    ookami:mean(hi(learn),hi(fear),hi(solo),lo(inst)),
    ari:mean(hi(inst),hi(conform),mid(learn),mid(fear),hi(confq)),
    kochoku:mean(lo(learn),hi(conform),hi(prec),hi(inst),lo(confq)),
    hyena:mean(lo(fear),hi(numBias),lo(learn),lo(badNews)),
    chimp:mean(lo(fear),hi(inst),lo(open),mid(prec)),
    bonobo:mean(hi(fear),lo(learn),lo(reward),hi(conform),hi(slack)),
    ecosys:balance(fear,reward,learn,conform)
  };
  var w=pickWinner(scores,ORG_PRIORITY), splitted=w.winnerScore<0.35;
  var alt=w.ranked.filter(function(e){return e[0]!==w.winnerKey;}).slice(0,2).map(function(e){return {key:e[0],label:TYPES[e[0]].label};});
  var pct={};Object.keys(scores).forEach(function(k){pct[k]=Math.round(scores[k]*100);});
  return {target:'org',axes:{fear:fear,reward:reward,learn:learn,conform:conform},stage:null,type:assign(TYPES[w.winnerKey],{key:w.winnerKey}),alt:splitted?alt:[],splitted:splitted,scores:pct,blend:blend(scores,['ecosys'],TYPES)};
}
var SELF_MAP={safety:[['s1',0],['s2',1]],intrinsic:[['s4',0]],rewardCtrl:[['s3',0],['s9',0]],autonomy:[['s5',0],['s12',0],['s6',1]],conform:[['s7',0]],confq:[['s8',0]],consist:[['s11',0],['s10',1]]};
var FAMILY_MAP={safety:[['f1',0],['f2',1]],intrinsic:[['f4',0]],rewardCtrl:[['f3',0]],autonomy:[['f5',0],['f6',1]],conform:[['f7',0]],confq:[['f8',0]],consist:[['f10',0],['f9',1]]};
function constructs(a,map){
  var c={};Object.keys(map).forEach(function(key){var vals=map[key].map(function(s){var v=Number(a[s[0]]);return s[1]?(6-v):v;});c[key]=normMean.apply(null,vals);});
  ['safety','intrinsic','rewardCtrl','autonomy','conform','confq','consist'].forEach(function(k){if(!(k in c))c[k]=50;});
  return c;
}
function relatingScores(c){
  return {
    ookami:mean(lo(c.safety),hi(c.conform)),
    ari:mean(hi(c.conform),mid(c.autonomy)),
    chimp:mean(hi(c.rewardCtrl),lo(c.intrinsic)),
    bonobo:mean(hi(c.safety),lo(c.rewardCtrl),lo(c.autonomy)),
    hyena:mean(lo(c.consist),lo(c.safety))
  };
}
function relatingResult(a,map,types,name){
  var c=constructs(a,map), scores=relatingScores(c);
  var anchor=clamp01(mean(hi(c.safety),hi(c.autonomy),hi(c.confq),hi(c.intrinsic),hi(c.consist)));
  var w=pickWinner(scores,ANIMAL_PRIORITY), splitted=w.winnerScore<0.35;
  var alt=w.ranked.filter(function(e){return e[0]!==w.winnerKey;}).slice(0,2).map(function(e){return {key:e[0],label:types[e[0]].label};});
  var pct={};Object.keys(scores).forEach(function(k){pct[k]=Math.round(scores[k]*100);});
  var axes={fear:Math.round(c.safety),reward:Math.round((c.intrinsic+(100-c.rewardCtrl))/2),learn:Math.round(c.autonomy),conform:Math.round(c.consist)};
  return {target:name,axes:axes,stage:null,aux:{healthyAnchor:Math.round(anchor*100)},type:assign(types[w.winnerKey],{key:w.winnerKey}),alt:splitted?alt:[],splitted:splitted,scores:pct,blend:blend(scores,[],types)};
}
function diagnoseSelf(a){return relatingResult(a,SELF_MAP,TYPES_SELF,'self');}
function diagnoseFamily(a){return relatingResult(a,FAMILY_MAP,TYPES_FAMILY,'family');}
function assign(o,extra){var r={},k;for(k in o)r[k]=o[k];for(k in extra)r[k]=extra[k];return r;}

/* ===== 画面 ===== */
var RADAR_LABELS={org:['安全','報酬','学習','連携'],self:['安全','報酬','学習','一貫'],family:['安全','報酬','学習','一貫']};
var current='org';
var form=document.getElementById('f'), result=document.getElementById('result'), err=document.getElementById('err'),
    tagline=document.getElementById('tagline'), note0=document.getElementById('note0');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderForm(){
  var list=QUESTION_SETS[current], html='', groups=[], map={}, n=0;
  list.forEach(function(q){if(!map[q.group]){map[q.group]=[];groups.push(q.group);}map[q.group].push(q);});
  groups.forEach(function(g){
    html+='<div class="q-group"><div class="legend">'+esc(g)+'</div>';
    map[g].forEach(function(q){
      n++;
      html+='<div class="q-item"><p class="q-text"><span class="q-num">Q'+n+'</span>'+esc(q.text)+'</p><div class="scale" role="radiogroup" aria-label="'+esc(q.text)+'">';
      SCALE.forEach(function(v){html+='<label><input type="radio" name="'+q.id+'" value="'+v+'"><span>'+v+'</span></label>';});
      html+='</div><div class="scale-ends"><span>全くそう思わない</span><span>とてもそう思う</span></div></div>';
    });
    html+='</div>';
  });
  form.innerHTML=html;
  tagline.textContent=TARGETS[current].tagline;
  note0.textContent=TARGETS[current].note;
  result.hidden=true; result.innerHTML=''; err.hidden=true;
}
function radarSVG(axes){
  var labels=RADAR_LABELS[current], vals=[axes.fear,axes.reward,axes.learn,axes.conform], cx=100,cy=100,R=70;
  function ang(i){return (-90+i*90)*Math.PI/180;}
  function P(i,rad){return [cx+rad*Math.cos(ang(i)),cy+rad*Math.sin(ang(i))];}
  function poly(rad){return [0,1,2,3].map(function(i){return P(i,rad).join(',');}).join(' ');}
  var grid=[0.25,0.5,0.75,1].map(function(g){return '<polygon points="'+poly(R*g)+'" class="r-grid"/>';}).join('');
  var ax=[0,1,2,3].map(function(i){var p=P(i,R);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" class="r-axis"/>';}).join('');
  var shape='<polygon points="'+[0,1,2,3].map(function(i){return P(i,R*vals[i]/100).join(',');}).join(' ')+'" class="r-shape"/>';
  var lab=labels.map(function(l,i){var p=P(i,R+17);return '<text x="'+p[0]+'" y="'+p[1]+'" class="r-label" text-anchor="middle">'+l+' '+vals[i]+'</text>';}).join('');
  return '<svg viewBox="-18 -12 236 224" role="img" aria-label="4軸レーダー">'+grid+ax+shape+lab+'</svg>';
}
function blendBar(b){
  if(b.weak) return '<p class="muted small">配合を出すには回答の振れが小さすぎます（中庸な回答が多い）。各設問への当てはまりに差が出ると、型の配合が表示されます。</p>';
  var segs=b.ordered.filter(function(o){return o.pct>0;}).map(function(o){return '<span class="blend-seg" style="flex:'+o.pct+';background:'+(TYPE_COLORS[o.key]||'#999')+'" title="'+esc(o.label)+' '+o.pct+'%"></span>';}).join('');
  var leg=b.ordered.filter(function(o){return o.pct>0;}).map(function(o){return '<li><span class="dot" style="background:'+(TYPE_COLORS[o.key]||'#999')+'"></span>'+esc(o.label)+' <b>'+o.pct+'%</b></li>';}).join('');
  return '<div class="blend-bar">'+segs+'</div><ul class="legend">'+leg+'</ul>';
}
function render(res){
  var T=TARGETS[current], t=res.type, labels=TYPES_BY_TARGET[current];
  var alt=res.alt.length?'<p class="muted small">次に近いタイプ：'+res.alt.map(function(a){return esc(a.label);}).join(' / ')+'（混成・移行期の可能性）</p>':'';
  var rows=Object.keys(res.scores).map(function(k){return [k,res.scores[k]];}).sort(function(a,b){return b[1]-a[1];}).map(function(e){return '<tr><td>'+esc((labels[e[0]]||{}).label||e[0])+'</td><td>'+e[1]+'</td></tr>';}).join('');
  var anchor=(res.aux&&typeof res.aux.healthyAnchor==='number')?'<p class="muted small">学習ゾーンへの近さ（健全アンカー）：'+res.aux.healthyAnchor+'％</p>':'';
  var ref=(NOTE_REF[current]||{})[t.key];
  result.innerHTML=
    '<span class="tag">'+(res.splitted?'混成タイプ':esc(T.heading))+'</span>'+
    '<h2>〈'+esc(t.label)+'〉</h2>'+
    '<div><p class="blend-title">型の配合（純血種はいない＝どの動物の混血か）</p>'+blendBar(res.blend)+'</div>'+
    '<div class="radar">'+radarSVG(res.axes)+'</div>'+
    '<p class="lede">'+esc(t.finding)+'</p>'+
    '<div class="cards"><div class="card weak"><b>いちばんの弱点</b><p>'+esc(t.weakness)+'</p></div><div class="card act"><b>明日からの打ち手</b><p>'+esc(t.action)+'</p></div></div>'+
    (ref?'<a class="ref-card" href="'+ref.u+'" target="_blank" rel="noopener"><span class="ref-k">📖 あなたの型の参考記事</span><b>'+esc(ref.t)+'</b><span class="ref-s">'+esc(ref.s)+'</span></a>':'')+
    alt+
    '<details><summary>判定の内訳（透明性）</summary><p class="muted small">「当てる」ためではなく、どの型に寄っているかを示す指標です。</p><table><thead><tr><th>型</th><th>適合度</th></tr></thead><tbody>'+rows+'</tbody></table>'+anchor+'</details>'+
    '<p class="muted small disclaimer">'+esc(T.note)+'</p>'+
    '<div class="actions"><button type="button" class="ghost" id="again">もう一度診断する</button></div>';
  result.hidden=false;
  document.getElementById('again').addEventListener('click',function(){renderForm();window.scrollTo({top:0,behavior:'smooth'});});
  result.scrollIntoView({behavior:'smooth',block:'start'});
}

/* イベント */
[].slice.call(document.querySelectorAll('.switch button')).forEach(function(btn){
  btn.addEventListener('click',function(){
    current=btn.getAttribute('data-t');
    [].slice.call(document.querySelectorAll('.switch button')).forEach(function(b){b.setAttribute('aria-pressed', b===btn?'true':'false');});
    renderForm();
  });
});
document.getElementById('go').addEventListener('click',function(){
  var ids=QUESTION_SETS[current].map(function(q){return q.id;}), answers={}, missing=false;
  for(var i=0;i<ids.length;i++){var el=form.querySelector('input[name="'+ids[i]+'"]:checked'); if(!el){missing=true;break;} answers[ids[i]]=Number(el.value);}
  if(missing){err.hidden=false; err.scrollIntoView({behavior:'smooth',block:'center'}); return;}
  err.hidden=true; render(diagnose(current,answers));
});
renderForm();
</script>
