<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #faf8f4; font-family: "Noto Sans JP", sans-serif; }
      .scene { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #faf8f4; }
      #scene1 { z-index: 1; }
      #scene2 { z-index: 2; opacity: 0; } #scene3 { z-index: 3; opacity: 0; }
      #scene4 { z-index: 4; opacity: 0; } #scene5 { z-index: 5; opacity: 0; }
      #scene6 { z-index: 6; opacity: 0; } #scene7 { z-index: 7; opacity: 0; }
      #scene8 { z-index: 8; opacity: 0; }
      .scene-content { display: flex; flex-direction: column; justify-content: center;
        align-items: center; width: 100%; height: 100%; padding: 130px 90px;
        gap: 30px; box-sizing: border-box; text-align: center; }
      .head { font-weight: 900; font-size: 84px; line-height: 1.28; color: #1d2321;
        letter-spacing: -0.02em; }
      .sub { font-weight: 600; font-size: 44px; color: #6b7370; }
      .type-name { font-weight: 900; font-size: 92px; color: #1d2321; letter-spacing: -0.02em; }
      .type-axis { font-weight: 800; font-size: 46px; color: #2f6f4f; background: #e6efe9;
        padding: 12px 34px; border-radius: 999px; }
      .type-merit { font-weight: 700; font-size: 48px; line-height: 1.35; color: #1d2321;
        max-width: 820px; }
      .telop { font-weight: 800; font-size: 52px; line-height: 1.38; color: #2f6f4f; max-width: 840px; }
      .hl { color: #d9893b; }
      .layers { font-weight: 700; font-size: 46px; line-height: 1.7; color: #1d2321; max-width: 840px; }
      .note { font-size: 28px; color: #6b7370; max-width: 740px; line-height: 1.4; }
      .url { font-weight: 700; font-size: 38px; color: #2f6f4f; }
      .row5 { display: flex; gap: 22px; align-items: flex-end; justify-content: center; flex-wrap: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920"
         data-start="0" data-duration="45">

      <div id="scene1" class="scene"><div class="scene-content">
        <div id="s1-chars" class="row5"><svg width="120" height="120" viewBox="0 0 280 280" aria-label="wolf"><polygon points="72,74 54,6 122,52" fill="#8a97a5"/><polygon points="208,74 226,6 158,52" fill="#8a97a5"/><ellipse cx="140" cy="150" rx="94" ry="88" fill="#9aa6b3"/><ellipse cx="140" cy="182" rx="52" ry="44" fill="#eef1f4"/><circle cx="111" cy="139" r="9" fill="#c9aa3c"/><circle cx="169" cy="139" r="9" fill="#c9aa3c"/><circle cx="111" cy="139" r="4" fill="#1d2321"/><circle cx="169" cy="139" r="4" fill="#1d2321"/><ellipse cx="140" cy="170" rx="14" ry="10" fill="#1d2321"/></svg><svg width="100" height="120" viewBox="0 0 280 280" aria-label="ant"><path d="M120,66 Q104,28 88,18" stroke="#5a2d1a" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M160,66 Q176,28 192,18" stroke="#5a2d1a" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="140" cy="226" rx="50" ry="50" fill="#6b3320"/><ellipse cx="140" cy="150" rx="38" ry="42" fill="#8a4528"/><circle cx="140" cy="80" r="42" fill="#7a3b22"/><circle cx="126" cy="76" r="5" fill="#fff"/><circle cx="154" cy="76" r="5" fill="#fff"/></svg><svg width="120" height="120" viewBox="0 0 280 280" aria-label="chimp"><circle cx="56" cy="142" r="36" fill="#7a5230"/><circle cx="224" cy="142" r="36" fill="#7a5230"/><ellipse cx="140" cy="150" rx="86" ry="92" fill="#5a3a22"/><ellipse cx="140" cy="166" rx="64" ry="74" fill="#b98a5e"/><circle cx="117" cy="153" r="9" fill="#1d2321"/><circle cx="163" cy="153" r="9" fill="#1d2321"/><path d="M114,206 Q140,220 166,206" stroke="#3a2415" stroke-width="5" fill="none" stroke-linecap="round"/></svg><svg width="120" height="120" viewBox="0 0 280 280" aria-label="bonobo"><circle cx="80" cy="80" r="34" fill="#2b2522"/><circle cx="200" cy="80" r="34" fill="#2b2522"/><ellipse cx="140" cy="150" rx="92" ry="92" fill="#3a322e"/><ellipse cx="140" cy="172" rx="60" ry="54" fill="#e7d8c5"/><circle cx="112" cy="140" r="22" fill="none" stroke="#2f6f4f" stroke-width="6"/><circle cx="168" cy="140" r="22" fill="none" stroke="#2f6f4f" stroke-width="6"/><circle cx="112" cy="140" r="7" fill="#1d2321"/><circle cx="168" cy="140" r="7" fill="#1d2321"/></svg><svg width="120" height="120" viewBox="0 0 280 280" aria-label="hyena"><polygon points="70,70 58,12 118,55" fill="#b8a48c"/><polygon points="210,70 222,12 162,55" fill="#b8a48c"/><ellipse cx="140" cy="150" rx="96" ry="86" fill="#c4b095"/><ellipse cx="140" cy="178" rx="56" ry="46" fill="#efe7d8"/><circle cx="110" cy="141" r="7.5" fill="#1d2321"/><circle cx="170" cy="141" r="7.5" fill="#1d2321"/><ellipse cx="140" cy="166" rx="14" ry="10" fill="#1d2321"/></svg></div>
        <div id="s1-head" class="head">あなたの組織は、<br />どの動物の群れ？</div>
      </div></div>

      <div id="scene2" class="scene"><div class="scene-content">

          <circle cx="111" cy="139" r="4" fill="#1d2321"/><circle cx="169" cy="139" r="4" fill="#1d2321"/>

      <div id="scene3" class="scene"><div class="scene-content">
        <div id="s3-char"><svg width="210" height="250" viewBox="0 0 280 280" aria-label="ant">
          <path d="M120,66 Q104,28 88,18" stroke="#5a2d1a" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M160,66 Q176,28 192,18" stroke="#5a2d1a" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M108,150 L60,130 M108,165 L58,170 M108,180 L64,205" stroke="#5a2d1a" stroke-width="5" stroke-linecap="round"/>
          <path d="M172,150 L220,130 M172,165 L222,170 M172,180 L216,205" stroke="#5a2d1a" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="140" cy="226" rx="50" ry="50" fill="#6b3320"/>
          <ellipse cx="140" cy="150" rx="38" ry="42" fill="#8a4528"/>
          <circle cx="140" cy="80" r="42" fill="#7a3b22"/>
          <circle cx="125" cy="75" r="8" fill="#fff"/><circle cx="155" cy="75" r="8" fill="#fff"/>

        </svg></div>
        <div id="s3-name" class="type-name">アリ型</div>
        <div id="s3-axis" class="type-axis">同調 × 理念</div>
        <div id="s3-merit" class="type-merit">大規模と再現性・行政</div>
      </div></div>

      <div id="scene4" class="scene"><div class="scene-content">
        <div id="s4-char"><svg width="240" height="240" viewBox="0 0 280 280" aria-label="chimp">
          <circle cx="56" cy="142" r="36" fill="#7a5230"/><circle cx="224" cy="142" r="36" fill="#7a5230"/>
          <circle cx="56" cy="142" r="19" fill="#9a6f48"/><circle cx="224" cy="142" r="19" fill="#9a6f48"/>
          <ellipse cx="140" cy="150" rx="86" ry="92" fill="#5a3a22"/>
          <ellipse cx="140" cy="166" rx="64" ry="74" fill="#b98a5e"/>

          <path d="M180,126 L144,138" stroke="#3a2415" stroke-width="6" stroke-linecap="round"/>

          <circle cx="117" cy="155" r="7" fill="#1d2321"/><circle cx="163" cy="155" r="7" fill="#1d2321"/>
          <ellipse cx="130" cy="188" rx="5" ry="7" fill="#3a2415"/><ellipse cx="150" cy="188" rx="5" ry="7" fill="#3a2415"/>
          <path d="M114,206 Q140,220 166,206" stroke="#3a2415" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg></div>

        <div id="s4-axis" class="type-axis">地位 × 政治</div>

      </div></div>

      <div id="scene5" class="scene"><div class="scene-content">
        <div id="s5-char"><svg width="240" height="240" viewBox="0 0 280 280" aria-label="bonobo">
          <circle cx="80" cy="80" r="34" fill="#2b2522"/><circle cx="200" cy="80" r="34" fill="#2b2522"/>
          <ellipse cx="140" cy="150" rx="92" ry="92" fill="#3a322e"/>
          <ellipse cx="140" cy="172" rx="60" ry="54" fill="#e7d8c5"/>
          <circle cx="112" cy="140" r="24" fill="none" stroke="#2f6f4f" stroke-width="6"/>
          <circle cx="168" cy="140" r="24" fill="none" stroke="#2f6f4f" stroke-width="6"/>
          <line x1="136" y1="140" x2="144" y2="140" stroke="#2f6f4f" stroke-width="6"/>
          <circle cx="112" cy="140" r="7" fill="#1d2321"/><circle cx="168" cy="140" r="7" fill="#1d2321"/>
          <path d="M120,188 Q140,202 160,188" stroke="#1d2321" stroke-width="4" fill="none"/>
        </svg></div>
        <div id="s5-name" class="type-name">ボノボ型</div>
        <div id="s5-axis" class="type-axis">共感 × 低恐怖</div>
        <div id="s5-merit" class="type-merit">協調と定着・福祉/教育</div>
      </div></div>

      <div id="scene6" class="scene"><div class="scene-content">
        <div id="s6-char"><svg width="240" height="240" viewBox="0 0 280 280" aria-label="hyena">
          <polygon points="70,70 58,12 118,55" fill="#b8a48c"/>
          <polygon points="210,70 222,12 162,55" fill="#b8a48c"/>
          <ellipse cx="140" cy="150" rx="96" ry="86" fill="#c4b095"/>
          <ellipse cx="140" cy="178" rx="56" ry="46" fill="#efe7d8"/>
          <circle cx="108" cy="136" r="17" fill="#fff"/><circle cx="172" cy="136" r="17" fill="#fff"/>
          <circle cx="110" cy="141" r="7.5" fill="#1d2321"/><circle cx="170" cy="141" r="7.5" fill="#1d2321"/>
          <path d="M92,130 Q108,121 125,131" stroke="#8a7960" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M155,131 Q172,121 188,130" stroke="#8a7960" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="140" cy="166" rx="14" ry="10" fill="#1d2321"/>
        </svg></div>
        <div id="s6-name" class="type-name">ハイエナ型</div>
        <div id="s6-axis" class="type-axis">金 × 未達への恐怖</div>
        <div id="s6-merit" class="type-merit">営業の爆発力・歩合</div>
      </div></div>

      <div id="scene7" class="scene"><div class="scene-content" style="gap:40px">
        <div id="s7-t1" class="head" style="font-size:72px">純血種はいない</div>
        <div id="s7-layers" class="layers">現場＝オオカミ／管理＝アリ<br />経営＝チンパン／文化＝ボノボ</div>
        <div id="s7-t2" class="telop"><span class="hl">リーダー＝生態系の設計者</span></div>
      </div></div>

      <div id="scene8" class="scene"><div class="scene-content">
        <div id="s8-chars" class="row5"><svg width="120" height="120" viewBox="0 0 280 280" aria-label="wolf"><polygon points="72,74 54,6 122,52" fill="#8a97a5"/><polygon points="208,74 226,6 158,52" fill="#8a97a5"/><ellipse cx="140" cy="150" rx="94" ry="88" fill="#9aa6b3"/><ellipse cx="140" cy="182" rx="52" ry="44" fill="#eef1f4"/><circle cx="111" cy="139" r="9" fill="#c9aa3c"/><circle cx="169" cy="139" r="9" fill="#c9aa3c"/><circle cx="111" cy="139" r="4" fill="#1d2321"/><circle cx="169" cy="139" r="4" fill="#1d2321"/><ellipse cx="140" cy="170" rx="14" ry="10" fill="#1d2321"/></svg><svg width="100" height="120" viewBox="0 0 280 280" aria-label="ant"><path d="M120,66 Q104,28 88,18" stroke="#5a2d1a" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M160,66 Q176,28 192,18" stroke="#5a2d1a" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="140" cy="226" rx="50" ry="50" fill="#6b3320"/><ellipse cx="140" cy="150" rx="38" ry="42" fill="#8a4528"/><circle cx="140" cy="80" r="42" fill="#7a3b22"/><circle cx="126" cy="76" r="5" fill="#fff"/><circle cx="154" cy="76" r="5" fill="#fff"/></svg><svg width="120" height="120" viewBox="0 0 280 280" aria-label="chimp"><circle cx="56" cy="142" r="36" fill="#7a5230"/><circle cx="224" cy="142" r="36" fill="#7a5230"/><ellipse cx="140" cy="150" rx="86" ry="92" fill="#5a3a22"/><ellipse cx="140" cy="166" rx="64" ry="74" fill="#b98a5e"/><circle cx="117" cy="153" r="9" fill="#1d2321"/><circle cx="163" cy="153" r="9" fill="#1d2321"/><path d="M114,206 Q140,220 166,206" stroke="#3a2415" stroke-width="5" fill="none" stroke-linecap="round"/></svg><svg width="120" height="120" viewBox="0 0 280 280" aria-label="bonobo"><circle cx="80" cy="80" r="34" fill="#2b2522"/><circle cx="200" cy="80" r="34" fill="#2b2522"/><ellipse cx="140" cy="150" rx="92" ry="92" fill="#3a322e"/><ellipse cx="140" cy="172" rx="60" ry="54" fill="#e7d8c5"/><circle cx="112" cy="140" r="22" fill="none" stroke="#2f6f4f" stroke-width="6"/><circle cx="168" cy="140" r="22" fill="none" stroke="#2f6f4f" stroke-width="6"/><circle cx="112" cy="140" r="7" fill="#1d2321"/><circle cx="168" cy="140" r="7" fill="#1d2321"/></svg><svg width="120" height="120" viewBox="0 0 280 280" aria-label="hyena"><polygon points="70,70 58,12 118,55" fill="#b8a48c"/><polygon points="210,70 222,12 162,55" fill="#b8a48c"/><ellipse cx="140" cy="150" rx="96" ry="86" fill="#c4b095"/><ellipse cx="140" cy="178" rx="56" ry="46" fill="#efe7d8"/><circle cx="110" cy="141" r="7.5" fill="#1d2321"/><circle cx="170" cy="141" r="7.5" fill="#1d2321"/><ellipse cx="140" cy="166" rx="14" ry="10" fill="#1d2321"/></svg></div>
        <div id="s8-head" class="head" style="font-size:66px">今、どの動物に<br />寄ってる？</div>
        <div id="s8-url" class="url">動物から組織を読む → 記事へ</div>
        <div id="s8-note" class="note">これは生物学でなく組織の比喩（レンズ）。純血種は存在しない。</div>
      </div></div>

      <audio id="bgm" src="bgm.wav" data-start="0" data-duration="45" data-track-index="0" data-volume="1.0"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* S1 フック (0-3) */
      tl.set("#s1-chars svg",{opacity:0,scale:0.5},0);
      tl.set("#s1-head",{opacity:0,y:50},0);
      tl.to("#s1-chars svg",{opacity:1,scale:1,duration:0.4,stagger:0.1,ease:"back.out(1.7)"},0.2);
      tl.to("#s1-head",{opacity:1,y:0,duration:0.6,ease:"power3.out"},1.0);

      /* 類型シーン共通 (S2-S6) */
      function introType(s,t){
        tl.set("#scene"+s+" .scene-content",{y:60},t-0.1);
        tl.to("#scene"+s,{opacity:1,duration:0.4,ease:"power2.inOut"},t);
        tl.to("#scene"+s+" .scene-content",{y:0,duration:0.5,ease:"power3.out"},t);
        tl.set("#s"+s+"-char",{opacity:0,scale:0.6},t);
        tl.set("#s"+s+"-name",{opacity:0,y:30},t);
        tl.set("#s"+s+"-axis",{opacity:0,scale:0.7},t);
        tl.set("#s"+s+"-merit",{opacity:0,y:30},t);
        tl.to("#s"+s+"-char",{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},t+0.3);
        tl.to("#s"+s+"-name",{opacity:1,y:0,duration:0.4,ease:"power3.out"},t+0.7);
        tl.to("#s"+s+"-axis",{opacity:1,scale:1,duration:0.4,ease:"back.out(2)"},t+1.0);
        tl.to("#s"+s+"-merit",{opacity:1,y:0,duration:0.4,ease:"power2.out"},t+1.3);
      }
      introType(2,3); introType(3,9); introType(4,15); introType(5,21); introType(6,27);

      /* S7 核心 (33-41) */
      tl.set("#scene7 .scene-content",{y:60},32.9);
      tl.to("#scene7",{opacity:1,duration:0.4,ease:"power2.inOut"},33);
      tl.to("#scene7 .scene-content",{y:0,duration:0.5,ease:"power3.out"},33);
      tl.set("#s7-t1",{opacity:0,y:30},33);
      tl.set("#s7-layers",{opacity:0,y:30},33);
      tl.set("#s7-t2",{opacity:0,scale:0.8},33);
      tl.to("#s7-t1",{opacity:1,y:0,duration:0.5,ease:"power3.out"},33.4);
      tl.to("#s7-layers",{opacity:1,y:0,duration:0.6,ease:"power2.out"},34.2);
      tl.to("#s7-t2",{opacity:1,scale:1,duration:0.5,ease:"back.out(1.8)"},35.8);

      /* S8 オチ (41-45) */
      tl.set("#scene8 .scene-content",{y:60},40.9);
      tl.to("#scene8",{opacity:1,duration:0.4,ease:"power2.inOut"},41);
      tl.to("#scene8 .scene-content",{y:0,duration:0.5,ease:"power3.out"},41);
      tl.set("#s8-chars svg",{opacity:0,scale:0.5},41);
      tl.set("#s8-head",{opacity:0,y:40},41);
      tl.set("#s8-url",{opacity:0,y:25},41);
      tl.set("#s8-note",{opacity:0},41);
      tl.to("#s8-chars svg",{opacity:1,scale:1,duration:0.4,stagger:0.08,ease:"back.out(1.7)"},41.3);
      tl.to("#s8-head",{opacity:1,y:0,duration:0.5,ease:"power3.out"},42.0);
      tl.to("#s8-url",{opacity:1,y:0,duration:0.4,ease:"power2.out"},42.6);
      tl.to("#s8-note",{opacity:1,duration:0.4,ease:"power1.out"},43.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
