<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #faf8f4; font-family: "Noto Sans JP", sans-serif; }
      .scene { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #faf8f4; }
      #scene1 { z-index: 1; }
      #scene2 { z-index: 2; opacity: 0; } #scene3 { z-index: 3; opacity: 0; }
      #scene4 { z-index: 4; opacity: 0; } #scene5 { z-index: 5; opacity: 0; }
      .scene-content { display: flex; flex-direction: column; justify-content: center;
        align-items: center; width: 100%; height: 100%; padding: 130px 90px;
        gap: 34px; box-sizing: border-box; text-align: center; }
      .head { font-weight: 900; font-size: 80px; line-height: 1.28; color: #1d2321; letter-spacing: -0.02em; }
      .sub { font-weight: 600; font-size: 44px; color: #6b7370; }
      .tag { font-weight: 700; font-size: 36px; color: #2f6f4f; background: #e6efe9; padding: 12px 30px; border-radius: 999px; }
      .telop { font-weight: 800; font-size: 50px; line-height: 1.38; color: #2f6f4f; max-width: 840px; }
      .hl { color: #d9893b; }
      .note { font-size: 28px; color: #6b7370; max-width: 740px; line-height: 1.4; }
      .url { font-weight: 700; font-size: 38px; color: #2f6f4f; }
      .monkey-stack { position: relative; width: 280px; height: 280px; }
      .monkey-stack > div { position: absolute; top: 0; left: 0; }
      .rewards { display: flex; gap: 90px; align-items: center; justify-content: center; }
      .reward-item { display: flex; flex-direction: column; align-items: center; gap: 8px;
        font-weight: 700; font-size: 34px; color: #6b7370; }
      .row { display: flex; gap: 50px; align-items: flex-end; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920"
         data-start="0" data-duration="45">

      <div id="scene1" class="scene"><div class="scene-content">
        <div id="s1-char"><svg width="280" height="280" viewBox="0 0 280 280" aria-label="monkey-happy">
          <ellipse cx="140" cy="150" rx="90" ry="92" fill="#8a6a4a"/>
          <path d="M60,110 Q140,40 220,110 Q200,80 140,72 Q80,80 60,110Z" fill="#e8dcc8"/>
          <ellipse cx="140" cy="165" rx="64" ry="68" fill="#caa97e"/>
          <circle cx="116" cy="150" r="11" fill="#1d2321"/><circle cx="164" cy="150" r="11" fill="#1d2321"/>
          <ellipse cx="140" cy="180" rx="6" ry="8" fill="#5a3a22"/>
          <path d="M114,200 Q140,218 166,200" stroke="#5a3a22" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg></div>
        <div id="s1-head" class="head">同じ給料でも、<br />不公平は組織を壊す</div>
      </div></div>

      <div id="scene2" class="scene"><div class="scene-content" style="gap:40px">
        <div id="s2-tag" class="tag">オマキザル実験</div>
        <div class="monkey-stack">
          <div id="s2-happy"><svg width="280" height="280" viewBox="0 0 280 280" aria-label="monkey-happy">
          <ellipse cx="140" cy="150" rx="90" ry="92" fill="#8a6a4a"/>
          <path d="M60,110 Q140,40 220,110 Q200,80 140,72 Q80,80 60,110Z" fill="#e8dcc8"/>
          <ellipse cx="140" cy="165" rx="64" ry="68" fill="#caa97e"/>
          <circle cx="116" cy="150" r="11" fill="#1d2321"/><circle cx="164" cy="150" r="11" fill="#1d2321"/>
          <ellipse cx="140" cy="180" rx="6" ry="8" fill="#5a3a22"/>
          <path d="M114,200 Q140,218 166,200" stroke="#5a3a22" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg></div>
          <div id="s2-angry" style="opacity:0"><svg width="280" height="280" viewBox="0 0 280 280" aria-label="monkey-angry">
            <ellipse cx="140" cy="150" rx="90" ry="92" fill="#8a6a4a"/>
            <path d="M60,110 Q140,40 220,110 Q200,80 140,72 Q80,80 60,110Z" fill="#e8dcc8"/>
            <ellipse cx="140" cy="165" rx="64" ry="68" fill="#caa97e"/>
            <path d="M98,140 L130,151" stroke="#1d2321" stroke-width="6" stroke-linecap="round"/>
            <path d="M182,140 L150,151" stroke="#1d2321" stroke-width="6" stroke-linecap="round"/>
            <circle cx="116" cy="158" r="11" fill="#1d2321"/><circle cx="164" cy="158" r="11" fill="#1d2321"/>
            <ellipse cx="140" cy="182" rx="6" ry="8" fill="#5a3a22"/>
            <path d="M116,208 Q140,194 164,208" stroke="#5a3a22" stroke-width="5" fill="none" stroke-linecap="round"/>
            <circle cx="90" cy="172" r="10" fill="#d98080" opacity="0.6"/>
            <circle cx="190" cy="172" r="10" fill="#d98080" opacity="0.6"/>
          </svg></div>
        </div>
        <div class="rewards">
          <div id="s2-cuke" class="reward-item"><svg width="90" height="100" viewBox="0 0 90 100" aria-label="cucumber"><rect x="32" y="14" width="26" height="74" rx="13" fill="#7faf4a"/><rect x="36" y="20" width="18" height="62" rx="9" fill="#9bc466"/><circle cx="45" cy="30" r="2.5" fill="#6a9a3a"/><circle cx="45" cy="48" r="2.5" fill="#6a9a3a"/><circle cx="45" cy="66" r="2.5" fill="#6a9a3a"/></svg><span>自分＝キュウリ</span></div>
          <div id="s2-grape" class="reward-item"><svg width="90" height="100" viewBox="0 0 90 100" aria-label="grape"><rect x="43" y="14" width="5" height="16" fill="#5a7a3a"/><circle cx="34" cy="46" r="13" fill="#7a4fa0"/><circle cx="56" cy="44" r="13" fill="#8a5fb0"/><circle cx="45" cy="64" r="13" fill="#6a4090"/><circle cx="62" cy="64" r="12" fill="#7a4fa0"/><circle cx="30" cy="66" r="11" fill="#8a5fb0"/><circle cx="46" cy="82" r="11" fill="#6a4090"/></svg><span>隣＝ブドウ</span></div>
        </div>
        <div id="s2-telop" class="telop">報酬は不変。変わったのは<span class="hl">"比較"</span>だけ</div>
      </div></div>

      <div id="scene3" class="scene"><div class="scene-content">
        <div id="s3-scale"><svg width="320" height="250" viewBox="0 0 320 250" aria-label="scale">
          <rect x="156" y="54" width="8" height="150" fill="#6b7370"/>
          <rect x="116" y="200" width="88" height="14" rx="6" fill="#6b7370"/>
          <line x1="84" y1="78" x2="236" y2="56" stroke="#6b7370" stroke-width="7" stroke-linecap="round"/>
          <line x1="84" y1="78" x2="84" y2="98" stroke="#6b7370" stroke-width="3"/>
          <path d="M62,98 Q84,116 106,98 Z" fill="#e6efe9" stroke="#2f6f4f" stroke-width="3"/>
          <line x1="236" y1="56" x2="236" y2="86" stroke="#6b7370" stroke-width="3"/>
          <path d="M202,86 Q236,116 270,86 Z" fill="#f4e0cf" stroke="#d9893b" stroke-width="4"/>
          <text x="84" y="142" text-anchor="middle" font-size="24" fill="#2f6f4f" font-weight="700">満足</text>
          <text x="236" y="142" text-anchor="middle" font-size="24" fill="#d9893b" font-weight="700">不満</text>
        </svg></div>
        <div id="s3-t1" class="head" style="font-size:70px">総額が同じでも<span class="hl">純損</span></div>
        <div id="s3-telop" class="telop">損は得より重い（κ &gt; 1）<br />冷遇の不満 ＞ 厚遇の満足</div>
      </div></div>

      <div id="scene4" class="scene"><div class="scene-content">
        <div id="s4-char"><svg width="240" height="240" viewBox="0 0 280 280" aria-label="chimp">
          <circle cx="56" cy="142" r="36" fill="#7a5230"/><circle cx="224" cy="142" r="36" fill="#7a5230"/>
          <circle cx="56" cy="142" r="19" fill="#9a6f48"/><circle cx="224" cy="142" r="19" fill="#9a6f48"/>
          <ellipse cx="140" cy="150" rx="86" ry="92" fill="#5a3a22"/>
          <ellipse cx="140" cy="166" rx="64" ry="74" fill="#b98a5e"/>
          <path d="M100,126 L136,138" stroke="#3a2415" stroke-width="6" stroke-linecap="round"/>
          <path d="M180,126 L144,138" stroke="#3a2415" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="116" cy="152" rx="13" ry="15" fill="#fff"/><ellipse cx="164" cy="152" rx="13" ry="15" fill="#fff"/>
          <circle cx="117" cy="155" r="7" fill="#1d2321"/><circle cx="163" cy="155" r="7" fill="#1d2321"/>
          <ellipse cx="130" cy="188" rx="5" ry="7" fill="#3a2415"/><ellipse cx="150" cy="188" rx="5" ry="7" fill="#3a2415"/>
          <path d="M114,206 Q140,220 166,206" stroke="#3a2415" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg></div>
        <div id="s4-t1" class="head" style="font-size:66px">差の大きさより<br /><span class="hl">"説明できるか"</span></div>
        <div id="s4-telop" class="telop">恣意的な差＝統制不能な罰<br />＝チンパン型の火種</div>
      </div></div>

      <div id="scene5" class="scene"><div class="scene-content">
        <div id="s5-chars" class="row"><svg width="150" height="150" viewBox="0 0 280 280" aria-label="monkey">
          <ellipse cx="140" cy="150" rx="90" ry="92" fill="#8a6a4a"/>
          <path d="M60,110 Q140,40 220,110 Q200,80 140,72 Q80,80 60,110Z" fill="#e8dcc8"/>
          <ellipse cx="140" cy="165" rx="64" ry="68" fill="#caa97e"/>
          <circle cx="116" cy="152" r="11" fill="#1d2321"/><circle cx="164" cy="152" r="11" fill="#1d2321"/>
          <ellipse cx="140" cy="180" rx="6" ry="8" fill="#5a3a22"/>
          <path d="M116,200 Q140,216 164,200" stroke="#5a3a22" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg><svg width="150" height="150" viewBox="0 0 280 280" aria-label="chimp">
          <circle cx="56" cy="142" r="36" fill="#7a5230"/><circle cx="224" cy="142" r="36" fill="#7a5230"/>
          <ellipse cx="140" cy="150" rx="86" ry="92" fill="#5a3a22"/>
          <ellipse cx="140" cy="166" rx="64" ry="74" fill="#b98a5e"/>
          <circle cx="117" cy="153" r="9" fill="#1d2321"/><circle cx="163" cy="153" r="9" fill="#1d2321"/>
          <path d="M114,206 Q140,220 166,206" stroke="#3a2415" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg></div>
        <div id="s5-head" class="head" style="font-size:64px">不公平のコストは<br />絶対額に出ない</div>
        <div id="s5-url" class="url">動物から組織を読む → 記事へ</div>
        <div id="s5-note" class="note">機構を表す式であって、特定組織のデータ分析ではない（比喩）。</div>
      </div></div>

      <audio id="bgm" src="bgm.wav" data-start="0" data-duration="45" data-track-index="0" data-volume="1.0"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* S1 フック (0-3) */
      tl.set("#s1-char",{opacity:0,scale:0.6},0);
      tl.set("#s1-head",{opacity:0,y:50},0);
      tl.to("#s1-char",{opacity:1,scale:1,duration:0.6,ease:"back.out(1.6)"},0.2);
      tl.to("#s1-head",{opacity:1,y:0,duration:0.6,ease:"power3.out"},0.7);

      /* T->S2 + 実験ハイライト (3-16) */
      tl.set("#scene2 .scene-content",{y:60},2.9);
      tl.to("#scene2",{opacity:1,duration:0.4,ease:"power2.inOut"},3);
      tl.to("#scene2 .scene-content",{y:0,duration:0.5,ease:"power3.out"},3);
      tl.set("#s2-tag",{opacity:0,scale:0.6},3);
      tl.set("#s2-cuke",{opacity:0,y:20},3);
      tl.set("#s2-grape",{opacity:0,y:20},3);
      tl.set("#s2-telop",{opacity:0,y:30},3);
      tl.to("#s2-tag",{opacity:1,scale:1,duration:0.4,ease:"back.out(2)"},3.4);
      tl.to("#s2-cuke",{opacity:1,y:0,duration:0.4,ease:"power2.out"},4.6);
      tl.to("#s2-grape",{opacity:1,y:0,duration:0.4,ease:"back.out(1.8)"},7.0);
      tl.to("#s2-happy",{opacity:0,duration:0.25},8.6);
      tl.to("#s2-angry",{opacity:1,duration:0.25},8.6);
      tl.to("#s2-angry",{rotation:-5,duration:0.12,yoyo:true,repeat:6,ease:"sine.inOut"},9.0);
      tl.to("#s2-cuke",{x:-220,y:-320,rotation:380,opacity:0,duration:0.6,ease:"power2.in"},10.2);
      tl.to("#s2-telop",{opacity:1,y:0,duration:0.5,ease:"power3.out"},11.8);

      /* T->S3 純損 (16-28) */
      tl.set("#scene3 .scene-content",{y:60},15.9);
      tl.to("#scene3",{opacity:1,duration:0.4,ease:"power2.inOut"},16);
      tl.to("#scene3 .scene-content",{y:0,duration:0.5,ease:"power3.out"},16);
      tl.set("#s3-scale",{opacity:0,scale:0.7},16);
      tl.set("#s3-t1",{opacity:0,y:30},16);
      tl.set("#s3-telop",{opacity:0,y:30},16);
      tl.to("#s3-scale",{opacity:1,scale:1,duration:0.6,ease:"back.out(1.6)"},16.4);
      tl.to("#s3-t1",{opacity:1,y:0,duration:0.5,ease:"power3.out"},17.6);
      tl.to("#s3-telop",{opacity:1,y:0,duration:0.5,ease:"power2.out"},18.8);

      /* T->S4 説明可能性 (28-40) */
      tl.set("#scene4 .scene-content",{y:60},27.9);
      tl.to("#scene4",{opacity:1,duration:0.4,ease:"power2.inOut"},28);
      tl.to("#scene4 .scene-content",{y:0,duration:0.5,ease:"power3.out"},28);
      tl.set("#s4-char",{opacity:0,scale:0.6},28);
      tl.set("#s4-t1",{opacity:0,y:30},28);
      tl.set("#s4-telop",{opacity:0,y:30},28);
      tl.to("#s4-char",{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},28.4);
      tl.to("#s4-t1",{opacity:1,y:0,duration:0.5,ease:"power3.out"},29.2);
      tl.to("#s4-telop",{opacity:1,y:0,duration:0.5,ease:"power2.out"},30.6);

      /* T->S5 オチ (40-45) */
      tl.set("#scene5 .scene-content",{y:60},39.9);
      tl.to("#scene5",{opacity:1,duration:0.4,ease:"power2.inOut"},40);
      tl.to("#scene5 .scene-content",{y:0,duration:0.5,ease:"power3.out"},40);
      tl.set("#s5-chars svg",{opacity:0,scale:0.5},40);
      tl.set("#s5-head",{opacity:0,y:40},40);
      tl.set("#s5-url",{opacity:0,y:25},40);
      tl.set("#s5-note",{opacity:0},40);
      tl.to("#s5-chars svg",{opacity:1,scale:1,duration:0.4,stagger:0.14,ease:"back.out(1.7)"},40.3);
      tl.to("#s5-head",{opacity:1,y:0,duration:0.5,ease:"power3.out"},41.0);
      tl.to("#s5-url",{opacity:1,y:0,duration:0.4,ease:"power2.out"},41.8);
      tl.to("#s5-note",{opacity:1,duration:0.4,ease:"power1.out"},42.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
