<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #faf8f4; font-family: "Noto Sans JP", sans-serif; }
      .scene { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #faf8f4; }
      #scene1 { z-index: 1; }
      #scene2 { z-index: 2; opacity: 0; } #scene3 { z-index: 3; opacity: 0; }
      #scene4 { z-index: 4; opacity: 0; } #scene5 { z-index: 5; opacity: 0; }
      .scene-content { display: flex; flex-direction: column; justify-content: center;
        align-items: center; width: 100%; height: 100%; padding: 130px 90px;
        gap: 34px; box-sizing: border-box; text-align: center; }
      .head { font-weight: 900; font-size: 76px; line-height: 1.28; color: #1d2321; letter-spacing: -0.02em; }
      .tag { font-weight: 700; font-size: 36px; color: #2f6f4f; background: #e6efe9; padding: 12px 30px; border-radius: 999px; }
      .telop { font-weight: 800; font-size: 48px; line-height: 1.38; color: #2f6f4f; max-width: 860px; }
      .hl { color: #d9893b; }
      .note { font-size: 28px; color: #6b7370; max-width: 740px; line-height: 1.4; }
      .url { font-weight: 700; font-size: 38px; color: #2f6f4f; }
      .exp { display: flex; gap: 40px; align-items: center; justify-content: center; }
      .systems { display: flex; flex-direction: column; gap: 18px; align-items: center; }
      .sys { width: 560px; border-radius: 20px; padding: 24px; font-weight: 900; font-size: 52px; line-height: 1.2; }
      .sys small { display: block; font-size: 34px; font-weight: 600; margin-top: 8px; }
      .sys.goal { background: #f1ece4; color: #6b7370; }
      .sys.habit { background: #e6efe9; color: #2f6f4f; }
      .arrow { font-weight: 900; font-size: 46px; color: #d9893b; }
      .tips { display: flex; flex-direction: column; gap: 20px; align-items: stretch; }
      .tip { width: 660px; border-radius: 18px; padding: 22px 30px; background: #e6efe9;
        font-weight: 800; font-size: 50px; color: #1d2321; text-align: left; }
      .tip b { color: #2f6f4f; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920"
         data-start="0" data-duration="45">

      <div id="scene1" class="scene"><div class="scene-content">
        <div id="s1-rat"><svg width="220" height="220" viewBox="0 0 280 280" aria-label="rat">
          <path d="M208,202 Q262,192 248,138" stroke="#c98f9a" stroke-width="9" fill="none" stroke-linecap="round"/>
          <circle cx="80" cy="86" r="40" fill="#9a9aa0"/><circle cx="200" cy="86" r="40" fill="#9a9aa0"/>
          <circle cx="80" cy="88" r="22" fill="#d9a6b0"/><circle cx="200" cy="88" r="22" fill="#d9a6b0"/>
          <ellipse cx="140" cy="160" rx="88" ry="80" fill="#aaaab0"/>
          <ellipse cx="140" cy="196" rx="48" ry="40" fill="#c6c6ca"/>
          <circle cx="112" cy="150" r="12" fill="#1d2321"/><circle cx="168" cy="150" r="12" fill="#1d2321"/>
          <ellipse cx="140" cy="190" rx="12" ry="9" fill="#d9a6b0"/>
          <rect x="132" y="200" width="16" height="20" rx="3" fill="#fff"/>
        </svg></div>
        <div id="s1-head" class="head">続けられないのは意志でなく<br /><span class="hl">きっかけの設計</span></div>
      </div></div>

      <div id="scene2" class="scene"><div class="scene-content">
        <div id="s2-exp" class="exp"><div id="s2-rat"><svg width="220" height="220" viewBox="0 0 280 280" aria-label="rat">
          <path d="M208,202 Q262,192 248,138" stroke="#c98f9a" stroke-width="9" fill="none" stroke-linecap="round"/>
          <circle cx="80" cy="86" r="40" fill="#9a9aa0"/><circle cx="200" cy="86" r="40" fill="#9a9aa0"/>
          <circle cx="80" cy="88" r="22" fill="#d9a6b0"/><circle cx="200" cy="88" r="22" fill="#d9a6b0"/>
          <ellipse cx="140" cy="160" rx="88" ry="80" fill="#aaaab0"/>
          <ellipse cx="140" cy="196" rx="48" ry="40" fill="#c6c6ca"/>
          <circle cx="112" cy="150" r="12" fill="#1d2321"/><circle cx="168" cy="150" r="12" fill="#1d2321"/>
          <ellipse cx="140" cy="190" rx="12" ry="9" fill="#d9a6b0"/>
          <rect x="132" y="200" width="16" height="20" rx="3" fill="#fff"/>
        </svg></div><div id="s2-lever"><svg width="140" height="190" viewBox="0 0 130 190" aria-label="lever">
          <rect x="54" y="66" width="18" height="105" fill="#6b7370"/>
          <rect x="18" y="166" width="94" height="16" rx="4" fill="#6b7370"/>
          <line x1="63" y1="74" x2="100" y2="40" stroke="#5a4a3a" stroke-width="14" stroke-linecap="round"/>
          <circle cx="102" cy="38" r="16" fill="#d9893b"/>
        </svg></div></div>
        <div id="s2-t1" class="head" style="font-size:56px">餌の価値↓でも押し続ける</div>
        <div id="s2-telop" class="telop">報酬から独立→きっかけへ<span class="hl">自動反応</span>＝習慣</div>
      </div></div>

      <div id="scene3" class="scene"><div class="scene-content">
        <div id="s3-sys" class="systems">
          <div id="s3-goal" class="sys goal">目標志向<small>報酬で計算する</small></div>
          <div id="s3-arrow" class="arrow">↓ 反復 ↓</div>
          <div id="s3-habit" class="sys habit">習慣<small>きっかけで自動再生</small></div>
        </div>
        <div id="s3-telop" class="telop" style="font-size:42px">報酬に頼る行動は、いつまでも習慣にならない</div>
      </div></div>

      <div id="scene4" class="scene"><div class="scene-content">
        <div id="s4-t1" class="head" style="font-size:58px">やる気でなく<span class="hl">設計</span></div>
        <div id="s4-tips" class="tips">
          <div class="tip"><b>①</b> 固定したきっかけ（cue）</div>
          <div class="tip"><b>②</b> 行動を小さく（摩擦↓）</div>
          <div class="tip"><b>③</b> 反復回数</div>
        </div>
      </div></div>

      <div id="scene5" class="scene"><div class="scene-content">
        <div id="s5-rat"><svg width="160" height="160" viewBox="0 0 280 280" aria-label="rat">
          <path d="M208,202 Q262,192 248,138" stroke="#c98f9a" stroke-width="9" fill="none" stroke-linecap="round"/>
          <circle cx="80" cy="86" r="40" fill="#9a9aa0"/><circle cx="200" cy="86" r="40" fill="#9a9aa0"/>
          <circle cx="80" cy="88" r="22" fill="#d9a6b0"/><circle cx="200" cy="88" r="22" fill="#d9a6b0"/>
          <ellipse cx="140" cy="160" rx="88" ry="80" fill="#aaaab0"/>
          <ellipse cx="140" cy="196" rx="48" ry="40" fill="#c6c6ca"/>
          <circle cx="112" cy="150" r="12" fill="#1d2321"/><circle cx="168" cy="150" r="12" fill="#1d2321"/>
          <ellipse cx="140" cy="190" rx="12" ry="9" fill="#d9a6b0"/>
          <rect x="132" y="200" width="16" height="20" rx="3" fill="#fff"/>
        </svg></div>
        <div id="s5-head" class="head" style="font-size:58px">悪癖も同じ機構<br><span class="hl">きっかけを壊す</span></div>
        <div id="s5-sub" class="telop" style="font-size:42px">続けたいなら 固定＋摩擦↓</div>
        <div id="s5-url" class="url">動物から組織を読む → 記事へ</div>
        <div id="s5-note" class="note">式で機構を表したものであって、効果保証ではない（比喩）。</div>
      </div></div>

      <audio id="bgm" src="bgm.wav" data-start="0" data-duration="45" data-track-index="0" data-volume="1.0"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* S1 フック (0-3) */
      tl.set("#s1-rat",{opacity:0,scale:0.6},0);
      tl.set("#s1-head",{opacity:0,y:50},0);
      tl.to("#s1-rat",{opacity:1,scale:1,duration:0.6,ease:"back.out(1.6)"},0.2);
      tl.to("#s1-head",{opacity:1,y:0,duration:0.6,ease:"power3.out"},0.8);

      /* T->S2 ラット実験 (3-16) */
      tl.set("#scene2 .scene-content",{y:60},2.9);
      tl.to("#scene2",{opacity:1,duration:0.4,ease:"power2.inOut"},3);
      tl.to("#scene2 .scene-content",{y:0,duration:0.5,ease:"power3.out"},3);
      tl.set("#s2-rat",{opacity:0,scale:0.7},3);
      tl.set("#s2-lever",{opacity:0,scale:0.7},3);
      tl.set("#s2-t1",{opacity:0,y:30},3);
      tl.set("#s2-telop",{opacity:0,y:30},3);
      tl.to("#s2-rat",{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},3.4);
      tl.to("#s2-lever",{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},3.7);
      tl.to("#s2-rat",{x:34,duration:0.3,ease:"power2.inOut",yoyo:true,repeat:7},4.6);
      tl.to("#s2-t1",{opacity:1,y:0,duration:0.5,ease:"power3.out"},7.2);
      tl.to("#s2-telop",{opacity:1,y:0,duration:0.5,ease:"power2.out"},8.4);

      /* T->S3 二つの系 (16-27) */
      tl.set("#scene3 .scene-content",{y:60},15.9);
      tl.to("#scene3",{opacity:1,duration:0.4,ease:"power2.inOut"},16);
      tl.to("#scene3 .scene-content",{y:0,duration:0.5,ease:"power3.out"},16);
      tl.set("#s3-goal",{opacity:0,y:30},16);
      tl.set("#s3-arrow",{opacity:0,scale:0.5},16);
      tl.set("#s3-habit",{opacity:0,y:30},16);
      tl.set("#s3-telop",{opacity:0,y:30},16);
      tl.to("#s3-goal",{opacity:1,y:0,duration:0.5,ease:"power3.out"},16.4);
      tl.to("#s3-arrow",{opacity:1,scale:1,duration:0.4,ease:"back.out(2)"},17.2);
      tl.to("#s3-habit",{opacity:1,y:0,duration:0.5,ease:"back.out(1.5)"},17.8);
      tl.to("#s3-telop",{opacity:1,y:0,duration:0.5,ease:"power2.out"},19.4);

      /* T->S4 続けるコツ (27-40) */
      tl.set("#scene4 .scene-content",{y:60},26.9);
      tl.to("#scene4",{opacity:1,duration:0.4,ease:"power2.inOut"},27);
      tl.to("#scene4 .scene-content",{y:0,duration:0.5,ease:"power3.out"},27);
      tl.set("#s4-t1",{opacity:0,y:30},27);
      tl.set("#s4-tips .tip",{opacity:0,x:-40},27);
      tl.to("#s4-t1",{opacity:1,y:0,duration:0.5,ease:"power3.out"},27.4);
      tl.to("#s4-tips .tip",{opacity:1,x:0,duration:0.5,stagger:0.25,ease:"power3.out"},28.2);

      /* T->S5 オチ (40-45) */
      tl.set("#scene5 .scene-content",{y:60},39.9);
      tl.to("#scene5",{opacity:1,duration:0.4,ease:"power2.inOut"},40);
      tl.to("#scene5 .scene-content",{y:0,duration:0.5,ease:"power3.out"},40);
      tl.set("#s5-rat",{opacity:0,scale:0.6},40);
      tl.set("#s5-head",{opacity:0,y:40},40);
      tl.set("#s5-sub",{opacity:0,y:25},40);
      tl.set("#s5-url",{opacity:0,y:25},40);
      tl.set("#s5-note",{opacity:0},40);
      tl.to("#s5-rat",{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},40.3);
      tl.to("#s5-head",{opacity:1,y:0,duration:0.5,ease:"power3.out"},41.0);
      tl.to("#s5-sub",{opacity:1,y:0,duration:0.4,ease:"power2.out"},41.8);
      tl.to("#s5-url",{opacity:1,y:0,duration:0.4,ease:"power2.out"},42.3);
      tl.to("#s5-note",{opacity:1,duration:0.4,ease:"power1.out"},42.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
