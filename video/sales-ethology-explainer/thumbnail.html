<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#faf8f4; font-family:"Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif; }
  #root { position:relative; width:1280px; height:720px; overflow:hidden; background:#faf8f4; }
  .band { position:absolute; left:0; right:0; bottom:0; height:296px;
    background:linear-gradient(180deg,#e6efe9 0%, #d6e7dc 100%); }
  .band:before { content:""; position:absolute; left:0; right:0; top:0; height:7px;
    background:#2f6f4f; opacity:0.28; }
  .kicker { position:absolute; left:60px; top:52px; font-weight:800; font-size:31px;
    color:#2f6f4f; letter-spacing:0.08em; background:#e6efe9; padding:11px 30px; border-radius:999px; }
  .badge { position:absolute; right:54px; top:50px; font-weight:900; font-size:34px;
    color:#fff; background:#d9893b; padding:13px 32px; border-radius:14px;
    box-shadow:0 9px 0 rgba(184,110,40,0.30); }
  .titlewrap { position:absolute; left:66px; top:156px; }
  .t1 { font-weight:900; font-size:62px; color:#1d2321; letter-spacing:-0.01em; white-space:nowrap; }
  .t2 { font-weight:900; font-size:120px; line-height:1.0; color:#d9893b; white-space:nowrap;
    letter-spacing:-0.02em; text-shadow:0 6px 0 rgba(29,35,33,0.14); margin-top:6px; }
  .t2 .q { color:#1d2321; }
  .row { position:absolute; left:0; right:0; bottom:30px; display:flex; gap:40px;
    justify-content:center; align-items:flex-end; }
  .row svg { filter:drop-shadow(0 11px 0 rgba(47,111,79,0.13)); }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="1">
    <div class="band"></div>
    <div class="kicker">動物行動学 × マネジメント</div>
    <div class="badge">営業の心理</div>
    <div class="titlewrap">
      <div class="t1">売れる理由は、</div>

    </div>

</body>
</html>
