<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #faf8f4; font-family: "Noto Sans JP", sans-serif; }
      .scene { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #faf8f4; }
      #scene1 { z-index: 1; }
      #scene2 { z-index: 2; opacity: 0; } #scene3 { z-index: 3; opacity: 0; }
      #scene4 { z-index: 4; opacity: 0; } #scene5 { z-index: 5; opacity: 0; }
      .scene-content { display: flex; flex-direction: column; justify-content: center;
        align-items: center; width: 100%; height: 100%; padding: 130px 90px;
        gap: 34px; box-sizing: border-box; text-align: center; }
      .head { font-weight: 900; font-size: 76px; line-height: 1.28; color: #1d2321; letter-spacing: -0.02em; }
      .tag { font-weight: 700; font-size: 36px; color: #d9893b; background: #f7ece1; padding: 12px 30px; border-radius: 999px; }
      .telop { font-weight: 800; font-size: 50px; line-height: 1.38; color: #2f6f4f; max-width: 840px; }
      .hl { color: #d9893b; }
      .note { font-size: 28px; color: #6b7370; max-width: 740px; line-height: 1.4; }
      .url { font-weight: 700; font-size: 38px; color: #2f6f4f; }
      .graph { width: 760px; height: 460px; }
      .axis { stroke: #6b7370; stroke-width: 3; }
      .curveV { fill: none; stroke: #d9893b; stroke-width: 9; stroke-linecap: round; }
      .baseline { stroke: #6b7370; stroke-width: 2; stroke-dasharray: 8 8; }
      .glabel { font-family: "Noto Sans JP", sans-serif; font-size: 30px; font-weight: 700; }
      .coins { display: flex; gap: 26px; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920"
         data-start="0" data-duration="45">

      <div id="scene1" class="scene"><div class="scene-content">
        <div id="s1-char"><svg width="220" height="220" viewBox="0 0 280 280" aria-label="hyena">
          <polygon points="70,70 58,12 118,55" fill="#b8a48c"/><polygon points="210,70 222,12 162,55" fill="#b8a48c"/>
          <ellipse cx="140" cy="150" rx="96" ry="86" fill="#c4b095"/>
          <ellipse cx="140" cy="178" rx="56" ry="46" fill="#efe7d8"/>
          <circle cx="108" cy="136" r="17" fill="#fff"/><circle cx="172" cy="136" r="17" fill="#fff"/>
          <circle cx="110" cy="141" r="7.5" fill="#1d2321"/><circle cx="170" cy="141" r="7.5" fill="#1d2321"/>
          <path d="M92,130 Q108,121 125,131" stroke="#8a7960" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M155,131 Q172,121 188,130" stroke="#8a7960" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="140" cy="166" rx="14" ry="10" fill="#1d2321"/>
        </svg></div>
        <div id="s1-head" class="head">「もっと払えば動く」<br />がなぜ裏目に</div>
      </div></div>

      <div id="scene2" class="scene"><div class="scene-content" style="gap:44px">
        <div id="s2-coins" class="coins"><svg width="110" height="110" viewBox="0 0 110 110" aria-label="coin"><ellipse cx="55" cy="60" rx="44" ry="44" fill="#d9b340"/><ellipse cx="55" cy="52" rx="44" ry="44" fill="#edc95e"/><ellipse cx="55" cy="52" rx="33" ry="33" fill="none" stroke="#c9a23a" stroke-width="3"/><text x="55" y="68" text-anchor="middle" font-size="46" font-weight="900" fill="#a8842a">¥</text></svg><svg width="110" height="110" viewBox="0 0 110 110" aria-label="coin"><ellipse cx="55" cy="60" rx="44" ry="44" fill="#d9b340"/><ellipse cx="55" cy="52" rx="44" ry="44" fill="#edc95e"/><ellipse cx="55" cy="52" rx="33" ry="33" fill="none" stroke="#c9a23a" stroke-width="3"/><text x="55" y="68" text-anchor="middle" font-size="46" font-weight="900" fill="#a8842a">¥</text></svg><svg width="110" height="110" viewBox="0 0 110 110" aria-label="coin"><ellipse cx="55" cy="60" rx="44" ry="44" fill="#d9b340"/><ellipse cx="55" cy="52" rx="44" ry="44" fill="#edc95e"/><ellipse cx="55" cy="52" rx="33" ry="33" fill="none" stroke="#c9a23a" stroke-width="3"/><text x="55" y="68" text-anchor="middle" font-size="46" font-weight="900" fill="#a8842a">¥</text></svg><svg width="90" height="90" viewBox="0 0 90 90" aria-label="x"><line x1="22" y1="22" x2="68" y2="68" stroke="#d9893b" stroke-width="11" stroke-linecap="round"/><line x1="68" y1="22" x2="22" y2="68" stroke="#d9893b" stroke-width="11" stroke-linecap="round"/></svg></div>
        <div id="s2-t1" class="head" style="font-size:60px">何も教えない</div>
        <div id="s2-telop" class="telop">一律ボーナス・予測昇給＝非随伴<br />効かないのは額でなく<span class="hl">"設計"</span></div>
      </div></div>

      <div id="scene3" class="scene"><div class="scene-content">
        <div id="s3-char"><svg width="220" height="220" viewBox="0 0 280 280" aria-label="hyena">
          <polygon points="70,70 58,12 118,55" fill="#b8a48c"/><polygon points="210,70 222,12 162,55" fill="#b8a48c"/>
          <ellipse cx="140" cy="150" rx="96" ry="86" fill="#c4b095"/>
          <ellipse cx="140" cy="178" rx="56" ry="46" fill="#efe7d8"/>
          <circle cx="108" cy="136" r="17" fill="#fff"/><circle cx="172" cy="136" r="17" fill="#fff"/>
          <circle cx="110" cy="141" r="7.5" fill="#1d2321"/><circle cx="170" cy="141" r="7.5" fill="#1d2321"/>
          <path d="M92,130 Q108,121 125,131" stroke="#8a7960" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M155,131 Q172,121 188,130" stroke="#8a7960" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="140" cy="166" rx="14" ry="10" fill="#1d2321"/>
        </svg></div>
        <div id="s3-t1" class="head" style="font-size:60px">ノルマ＋恐怖<br />→ <span class="hl">不正</span></div>
        <div id="s3-telop" class="telop">無断口座（Wells Fargo）<br />測るものが歪めば組織も歪む</div>
      </div></div>

      <div id="scene4" class="scene"><div class="scene-content" style="gap:28px">
        <div id="s4-tag" class="tag">内発の谷</div>
        <svg id="s4-graph" class="graph" viewBox="0 0 760 460">
          <line class="axis" x1="90" y1="40" x2="90" y2="400" />
          <line class="axis" x1="90" y1="400" x2="710" y2="400" />
          <line class="baseline" x1="90" y1="150" x2="710" y2="150" />
          <text class="glabel" x="22" y="50" fill="#2f6f4f">動機</text>
          <text class="glabel" x="600" y="445" fill="#d9893b">報酬 →</text>
          <text class="glabel" x="600" y="140" fill="#6b7370" font-size="24">無報酬時</text>
          <path id="s4-curve" class="curveV" d="M115,130 C260,150 300,360 420,360 C540,360 620,250 700,235" />
        </svg>
        <div id="s4-telop" class="telop" style="font-size:44px">内発が高い役割ほど<br />金銭で動機が<span class="hl">"谷"</span>に</div>
      </div></div>

      <div id="scene5" class="scene"><div class="scene-content">
        <div id="s5-char"><svg width="160" height="160" viewBox="0 0 280 280" aria-label="hyena">
          <polygon points="70,70 58,12 118,55" fill="#b8a48c"/><polygon points="210,70 222,12 162,55" fill="#b8a48c"/>
          <ellipse cx="140" cy="150" rx="96" ry="86" fill="#c4b095"/>
          <ellipse cx="140" cy="178" rx="56" ry="46" fill="#efe7d8"/>
          <circle cx="108" cy="136" r="17" fill="#fff"/><circle cx="172" cy="136" r="17" fill="#fff"/>
          <circle cx="110" cy="141" r="7.5" fill="#1d2321"/><circle cx="170" cy="141" r="7.5" fill="#1d2321"/>
          <ellipse cx="140" cy="166" rx="14" ry="10" fill="#1d2321"/>
        </svg></div>
        <div id="s5-head" class="head" style="font-size:58px">承認・裁量・意味は<br />内発を壊さない</div>
        <div id="s5-q" class="telop" style="font-size:46px"><span class="hl">随伴は正しいか？</span></div>
        <div id="s5-url" class="url">動物から組織を読む → 記事へ</div>
        <div id="s5-note" class="note">機構を表す式であって、特定企業の内部を断定する分析ではない（比喩）。</div>
      </div></div>

      <audio id="bgm" src="bgm.wav" data-start="0" data-duration="45" data-track-index="0" data-volume="1.0"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* S1 フック (0-3) */
      tl.set("#s1-char",{opacity:0,scale:0.6},0);
      tl.set("#s1-head",{opacity:0,y:50},0);
      tl.to("#s1-char",{opacity:1,scale:1,duration:0.6,ease:"back.out(1.6)"},0.2);
      tl.to("#s1-head",{opacity:1,y:0,duration:0.6,ease:"power3.out"},0.7);

      /* T->S2 非随伴 (3-13) */
      tl.set("#scene2 .scene-content",{y:60},2.9);
      tl.to("#scene2",{opacity:1,duration:0.4,ease:"power2.inOut"},3);
      tl.to("#scene2 .scene-content",{y:0,duration:0.5,ease:"power3.out"},3);
      tl.set("#s2-coins svg",{opacity:0,scale:0.5},3);
      tl.set("#s2-t1",{opacity:0,y:30},3);
      tl.set("#s2-telop",{opacity:0,y:30},3);
      tl.to("#s2-coins svg",{opacity:1,scale:1,duration:0.4,stagger:0.18,ease:"back.out(1.8)"},3.4);
      tl.to("#s2-t1",{opacity:1,y:0,duration:0.5,ease:"power3.out"},5.2);
      tl.to("#s2-telop",{opacity:1,y:0,duration:0.5,ease:"power2.out"},6.4);

      /* T->S3 Wells Fargo (13-26) */
      tl.set("#scene3 .scene-content",{y:60},12.9);
      tl.to("#scene3",{opacity:1,duration:0.4,ease:"power2.inOut"},13);
      tl.to("#scene3 .scene-content",{y:0,duration:0.5,ease:"power3.out"},13);
      tl.set("#s3-char",{opacity:0,scale:0.6},13);
      tl.set("#s3-t1",{opacity:0,y:30},13);
      tl.set("#s3-telop",{opacity:0,y:30},13);
      tl.to("#s3-char",{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},13.4);
      tl.to("#s3-t1",{opacity:1,y:0,duration:0.5,ease:"power3.out"},14.2);
      tl.to("#s3-telop",{opacity:1,y:0,duration:0.5,ease:"power2.out"},15.6);

      /* T->S4 内発の谷 (26-40) */
      tl.set("#scene4 .scene-content",{y:60},25.9);
      tl.to("#scene4",{opacity:1,duration:0.4,ease:"power2.inOut"},26);
      tl.to("#scene4 .scene-content",{y:0,duration:0.5,ease:"power3.out"},26);
      tl.set("#s4-tag",{opacity:0,scale:0.6},26);
      tl.set("#s4-telop",{opacity:0,y:30},26);
      tl.set("#s4-curve",{strokeDasharray:1300,strokeDashoffset:1300},26);
      tl.to("#s4-tag",{opacity:1,scale:1,duration:0.4,ease:"back.out(2)"},26.4);
      tl.to("#s4-curve",{strokeDashoffset:0,duration:2.2,ease:"power1.inOut"},27.0);
      tl.to("#s4-telop",{opacity:1,y:0,duration:0.5,ease:"power3.out"},32.2);

      /* T->S5 オチ (40-45) */
      tl.set("#scene5 .scene-content",{y:60},39.9);
      tl.to("#scene5",{opacity:1,duration:0.4,ease:"power2.inOut"},40);
      tl.to("#scene5 .scene-content",{y:0,duration:0.5,ease:"power3.out"},40);
      tl.set("#s5-char",{opacity:0,scale:0.6},40);
      tl.set("#s5-head",{opacity:0,y:40},40);
      tl.set("#s5-q",{opacity:0,scale:0.8},40);
      tl.set("#s5-url",{opacity:0,y:25},40);
      tl.set("#s5-note",{opacity:0},40);
      tl.to("#s5-char",{opacity:1,scale:1,duration:0.4,ease:"back.out(1.6)"},40.3);
      tl.to("#s5-head",{opacity:1,y:0,duration:0.5,ease:"power3.out"},40.9);
      tl.to("#s5-q",{opacity:1,scale:1,duration:0.4,ease:"back.out(1.8)"},41.6);
      tl.to("#s5-url",{opacity:1,y:0,duration:0.4,ease:"power2.out"},42.2);
      tl.to("#s5-note",{opacity:1,duration:0.4,ease:"power1.out"},42.7);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
