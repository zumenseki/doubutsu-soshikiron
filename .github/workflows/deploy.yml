name: Deploy site to GitHub Pages

# site/（Astro 静的サイト）を build して GitHub Pages へ公開する。
# 公式テンプレ（withastro/action → actions/deploy-pages）。run: に外部入力を直書きしない＝注入面なし。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに集約（公開中のデプロイは中断しない）。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # withastro/action は check-latest を透過しない（inputs は path / node-version / package-manager のみ）。
      # 先に check-latest: true の setup-node で最新 22.x を runner の toolcache に入れておくと、
      # withastro/action 内部の setup-node（toolcache 優先・同じ 22 指定）がその最新版を拾う
      # ＝runner 同梱の古い Node で build しない（2026-10-21 Node セキュリティリリース対応）。
      - name: Setup Node (check-latest で修正版を取得)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Build Astro site (in site/)
        uses: withastro/action@v3
        with:
          path: site
          node-version: 22 # Astro 6 は Node >=22.12 必須（既定の Node 20 では astro build が落ちる）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
